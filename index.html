<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>DriveCoding Bayern</title>
<link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;600&family=Roboto:wght@300;400;700&display=swap" rel="stylesheet">
<style>
:root{--accent:#00d0ff}
body{margin:0;font-family:Roboto,Arial;background:#0b0f14;color:#e6eef5}
header{padding:25px;text-align:center;background:linear-gradient(90deg,#02060a,#111a22)}
h1{font-family:Orbitron;font-size:38px;color:var(--accent);margin:0}
.lang{position:absolute;top:15px;right:20px}
.lang button{margin:2px;padding:6px 10px;background:#222;border:0;color:#fff;cursor:pointer;border-radius:6px}
.container{display:flex}
nav{width:230px;background:#06090d;padding:20px;min-height:100vh}
nav button{display:block;width:100%;margin:10px 0;padding:14px;background:#121a22;border:0;color:#fff;border-radius:8px;cursor:pointer}
section{flex:1;padding:30px;display:none}
.active{display:block}
.s1{background:#101820}
.s2{background:#1a1414}
.s3{background:#141a14}
.s4{background:#16131a}
.s5{background:#0f1a1c}
.card{background:#0b1218;padding:20px;border-radius:12px;margin:10px 0}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(260px,1fr));gap:20px}
.grid img{width:100%;border-radius:10px}
.call{position:fixed;bottom:20px;right:20px;background:#00ff99;color:#000;padding:16px 22px;border-radius:50px;font-weight:bold;text-decoration:none}
</style>
</head>
<body>
<header>
<div class="lang">
<button onclick="setLang('de')">DE</button>
<button onclick="setLang('en')">EN</button>
<button onclick="setLang('sr')">SR</button>
</div>
<h1>DriveCoding Bayern</h1>
<div id="subtitle"></div>
</header>
<div class="container">
<nav>
<button onclick="openPage('leistungen')" id="m1"></button>
<button onclick="openPage('preise')" id="m2"></button>
<button onclick="openPage('vag')">VAG</button>
<button onclick="openPage('bmw')">BMW</button>
<button onclick="openPage('kontakt')" id="m3"></button>
</nav>
<section id="leistungen" class="s1 active">
<h2 id="l1"></h2>
<div class="grid">
<img src="https://images.unsplash.com/photo-1619767886558-efdc7c2f3b2a">
<img src="https://images.unsplash.com/photo-1503376780353-7e6692767b70">
<img src="https://images.unsplash.com/photo-1552519507-da3b142c6e3d">
</div>
<div class="card" id="ltext"></div>
</section>
<section id="preise" class="s2">
<h2 id="p1"></h2>
<div class="card" id="plist"></div>
</section>
<section id="vag" class="s3">
<h2>VAG Codierungen</h2>
<div class="card">Start/Stop Memory<br>Video in Motion<br>Ambientebeleuchtung<br>CarPlay Aktivierung<br>DPF Reset</div>
</section>
<section id="bmw" class="s4">
<h2>BMW Codierungen</h2>
<div class="card">M Performance Optionen<br>Komfortblinken<br>Start/Stop Default Off<br>Sport Displays<br>Apple CarPlay Fullscreen</div>
</section>
<section id="kontakt" class="s5">
<h2 id="k1"></h2>
<div class="card">📞 +49 1573 6762046<br>📧 kfz.coding.servis@gmail.com<br>Nürnberg</div>
</section>
</div>
<a class="call" id="callbtn" href="tel:+4915736762046"></a>
<script>
function openPage(id){document.querySelectorAll('section').forEach(s=>s.classList.remove('active'));document.getElementById(id).classList.add('active')}
const t={
 de:{sub:'Fahrzeugcodierung & Diagnose',m1:'Leistungen',m2:'Preisliste',m3:'Kontakt',l1:'Was wir machen',ltext:'Professionelle Codierung und Nachrüstung für VAG & BMW Fahrzeuge.',p1:'Preisliste',plist:'Diagnose 30€<br>Codierung 40€<br>Paket 70€<br>Komplett 120€',k1:'Kontakt',call:'Jetzt anrufen'},
 en:{sub:'Vehicle coding & diagnostics',m1:'Services',m2:'Price list',m3:'Contact',l1:'What we do',ltext:'Professional coding and retrofit for VAG & BMW cars.',p1:'Prices',plist:'Diagnostics 30€<br>Coding 40€<br>Package 70€<br>Full 120€',k1:'Contact',call:'Call now'},
 sr:{sub:'Kodiranje i dijagnostika vozila',m1:'Usluge',m2:'Cenovnik',m3:'Kontakt',l1:'Sta radimo',ltext:'Profesionalno kodiranje i aktivacije za VAG i BMW vozila.',p1:'Cene',plist:'Dijagnostika 30€<br>Kodiranje 40€<br>Paket 70€<br>Komplet 120€',k1:'Kontakt',call:'Pozovi odmah'}
}
function setLang(l){document.getElementById('subtitle').innerText=t[l].sub;document.getElementById('m1').innerText=t[l].m1;document.getElementById('m2').innerText=t[l].m2;document.getElementById('m3').innerText=t[l].m3;document.getElementById('l1').innerText=t[l].l1;document.getElementById('ltext').innerHTML=t[l].ltext;document.getElementById('p1').innerText=t[l].p1;document.getElementById('plist').innerHTML=t[l].plist;document.getElementById('k1').innerText=t[l].k1;document.getElementById('callbtn').innerText=t[l].call}
setLang('de');
</script>
</body>
</html>
